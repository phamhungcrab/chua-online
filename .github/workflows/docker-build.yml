name: Build & Release Temple Live Studio Docker Image

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

jobs:
  test_and_build:
    name: Test & Build Production Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Build Frontend & Typecheck
        run: npm run build

      - name: Set Image Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v1.0.2" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: temple-live-studio:${{ steps.vars.outputs.TAG }}
          outputs: type=docker,dest=/tmp/temple-live-studio-${{ steps.vars.outputs.TAG }}.tar

      - name: Verify Container Health
        run: |
          docker load -i /tmp/temple-live-studio-${{ steps.vars.outputs.TAG }}.tar
          docker run -d --name test-temple -p 3000:3000 temple-live-studio:${{ steps.vars.outputs.TAG }}
          sleep 5
          curl -f http://127.0.0.1:3000/api/health || (docker logs test-temple && exit 1)
          docker rm -f test-temple

      - name: Upload Docker Image TAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: temple-live-studio-${{ steps.vars.outputs.TAG }}-image
          path: /tmp/temple-live-studio-${{ steps.vars.outputs.TAG }}.tar
          retention-days: 14
